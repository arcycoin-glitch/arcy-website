<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" role="img" aria-labelledby="owlTitle owlDesc">
<title id="owlTitle">ARCY neon cyber owl</title><desc id="owlDesc">Angular navy owl with electric cyan eyes, blue horn-shaped brows and purple armored feathers, framed by a luminous circular halo.</desc>
<defs>
<radialGradient id="bg"><stop stop-color="#0b2145"/><stop offset=".68" stop-color="#031126"/><stop offset="1" stop-color="#020917"/></radialGradient>
<linearGradient id="face" x2=".8" y2="1"><stop stop-color="#102d56"/><stop offset=".58" stop-color="#06182d"/><stop offset="1" stop-color="#020b20"/></linearGradient>
<linearGradient id="edge" x1=".15" y1="0" x2=".85" y2="1"><stop stop-color="#00eeff"/><stop offset=".58" stop-color="#008bee"/><stop offset="1" stop-color="#7226e9"/></linearGradient>
<linearGradient id="wing" x2="1" y2=".7"><stop stop-color="#0b3155"/><stop offset=".8" stop-color="#061a38"/><stop offset="1" stop-color="#270862"/></linearGradient>
<radialGradient id="eyes"><stop stop-color="#21fbf8"/><stop offset=".85" stop-color="#02ddea"/><stop offset="1" stop-color="#0087d4"/></radialGradient>
<filter id="glow" x="-50%" width="200%" y="-50%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft"><feGaussianBlur stdDeviation="10"/></filter>
</defs>

