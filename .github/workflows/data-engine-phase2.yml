name: Data engine phase 2 (real-chain, read-only)
# Real-chain evidence for PR #316 phase 2. Read-only: public RPC / public report API / DEX Screener pool reads only.
# Never writes production data, never deploys, holds no secrets.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/phase2-probe.cjs'
      - 'scripts/mechanics-target-probe.cjs'
      - 'scripts/market-onchain-probe.cjs'
      - 'scripts/chain4663-capacity-probe.cjs'
      - 'scripts/holder-chain-census.cjs'
      - 'scripts/coverage-compare.cjs'
      - 'scripts/coverage-ab.cjs'
      - 'lib/holder-disk.js'
      - 'scripts/ci-publication-server.cjs'
      - 'lib/holder-*.js'
      - 'search/server/lib/**'
      - 'search/server/lib/market-onchain.js'
      - 'search/server/lib/market-cross.js'
      - '.github/workflows/data-engine-phase2.yml'
permissions:
  contents: read
# One real-chain run at a time per branch (public RPC rate limits). A newer push CANCELS the superseded run: the gate is always
# evaluated on the latest commit, and a stale 75-90 min census no longer blocks it (#330: 92 min queue behind a superseded run).
concurrency:
  group: data-engine-phase2-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: On-chain market verification on the fixed cohort (DEX Screener pools re-read at a pinned block)
        run: node scripts/market-onchain-probe.cjs
      - name: Mechanics target probe (Robinhood contracts with unresolved architecture)
        if: always()
        run: node scripts/mechanics-target-probe.cjs 0x2d8d6f4a93acd7a916a5a654ec8b690ba3b3eadd 0x2e8c31162b855a2ffa90f6f8634643ad6f111e18
  ab:
    # Fixed-cohort A/B in ONE environment: main vs this branch, both served locally from the runner with identical env and network.
    # Real chains only: chain-4663 census from the public RPC, DEX Screener + on-chain pool re-reads. Ephemeral CI signing key; nothing
    # is written anywhere except the runner's temp directories.
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
        with:
          path: branch
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ephemeral CI key + localhost certificate
        run: |
          node -e "const c=require('crypto');const {privateKey,publicKey}=c.generateKeyPairSync('ed25519');require('fs').writeFileSync('/tmp/sign.pem',privateKey.export({format:'pem',type:'pkcs8'}));require('fs').writeFileSync('/tmp/pub.pem',publicKey.export({format:'pem',type:'spki'}))"
          openssl req -x509 -newkey rsa:2048 -nodes -keyout /tmp/tls.key -out /tmp/tls.crt -days 1 -subj "/CN=localhost" -addext "subjectAltName=DNS:localhost" 2>/dev/null
      # Dependency-aware census reuse (scripts/ci-census-cache.cjs). ONLY unsigned checkpoints are cached: every CI run signs with its own
      # ephemeral key, so cached signed snapshots would be unverifiable and the private key is never written to a cached path. A reused
      # checkpoint set is re-published and RE-SIGNED by a short top-up census (which also catches up to the current head), so the A/B step
      # still verifies fresh signatures. The cache key covers the cohort file, holder/census code and wallet-budget config; the manifest
      # records provenance and is rejected when older than 72 h. "Complete" means every token is COMPLETE or in a deterministic scale-limit
      # terminal state (e.g. PONS above the 100k wallet budget), never FAILED/BUILDING.
      - name: Census input fingerprint
        id: fp
        working-directory: branch
        run: echo "fp=$(node scripts/ci-census-cache.cjs fingerprint)" >> "$GITHUB_OUTPUT"
      - name: Restore bounded-complete chain-4663 checkpoints (same fingerprint)
        id: reuse
        uses: actions/cache/restore@v4
        with:
          path: |
            /tmp/holder-index
            /tmp/census-provenance
          key: holder-complete-4663-v2-${{ steps.fp.outputs.fp }}
      - name: Validate cache provenance, freshness and absence of key material
        id: valid
        working-directory: branch
        env:
          ARC_INDEX_CACHE_DIR: /tmp/holder-index
        run: |
          if [ "${{ steps.reuse.outputs.cache-hit }}" = "true" ] && node scripts/ci-census-cache.cjs validate; then
            echo "reuse=true" >> "$GITHUB_OUTPUT"
          else
            echo "reuse=false" >> "$GITHUB_OUTPUT"; rm -rf /tmp/holder-index /tmp/census-provenance
          fi
      - name: Restore chain-4663 checkpoints from the previous run
        if: steps.valid.outputs.reuse != 'true'
        uses: actions/cache/restore@v4
        with:
          path: /tmp/holder-index
          key: holder-index-4663-${{ github.run_id }}
          restore-keys: holder-index-4663-
      - name: Chain-4663 durable census (real Robinhood Chain RPC; short top-up + re-sign when checkpoints were reused)
        working-directory: branch
        env:
          ARC_HOLDER_STORAGE: local
          ARC_INDEX_CACHE_DIR: /tmp/holder-index
          ARC_HOLDER_PUBLISHED_DIR: /tmp/holder-pub
          CENSUS_BUDGET_MS: ${{ steps.valid.outputs.reuse == 'true' && '900000' || '4500000' }}
        run: |
          export ARC_HOLDER_SIGNING_KEY="$(cat /tmp/sign.pem)"
          node scripts/holder-chain-census.cjs | tee /tmp/census.log | grep -E "CENSUS_TOTAL|CENSUS_RESOURCES" || true
          ls -la /tmp/holder-pub/4663 | head -30 || true
      - name: Save chain-4663 checkpoints for the next run (rolling resume cache)
        if: always() && steps.valid.outputs.reuse != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/holder-index
          key: holder-index-4663-${{ github.run_id }}
      - name: Provenance + key-material scan for bounded-complete census
        id: mark
        if: always() && steps.valid.outputs.reuse != 'true'
        working-directory: branch
        env:
          ARC_INDEX_CACHE_DIR: /tmp/holder-index
        run: |
          node scripts/ci-census-cache.cjs scan
          if node scripts/ci-census-cache.cjs write /tmp/census.log; then echo "done=true" >> "$GITHUB_OUTPUT"; else echo "done=false" >> "$GITHUB_OUTPUT"; fi
      - name: Save bounded-complete checkpoints for fingerprint reuse
        if: always() && steps.valid.outputs.reuse != 'true' && steps.mark.outputs.done == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            /tmp/holder-index
            /tmp/census-provenance
          key: holder-complete-4663-v2-${{ steps.fp.outputs.fp }}
      - name: Start publication server, main and branch
        run: |
          sudo "$(which node)" branch/scripts/ci-publication-server.cjs /tmp/holder-pub /tmp/tls.crt /tmp/tls.key > /tmp/pubsrv.log 2>&1 &
          export NODE_EXTRA_CA_CERTS=/tmp/tls.crt ARC_HOLDER_PUBLISHED_URL=https://localhost/snapshots/ ARC_HOLDER_PUBLIC_KEY="$(cat /tmp/pub.pem)"
          (cd main && PORT=3001 SEARCH_MARKET_ONCHAIN_CHECK=on node dev.cjs > /tmp/main.log 2>&1 &)
          (cd branch && PORT=3002 SEARCH_MARKET_ONCHAIN_CHECK=on SEARCH_MARKET_ONCHAIN_VOLUME=on node dev.cjs > /tmp/branch.log 2>&1 &)
          sleep 3; curl -sk -o /dev/null -w "pub %{http_code}\n" https://localhost/snapshots/4663/0x0000000000000000000000000000000000000000.json || true
      - name: Interleaved verified coverage - main (A) vs branch (B), same tokens at the same moments
        working-directory: branch
        env:
          AB_BASE_A: http://127.0.0.1:3001
          AB_BASE_B: http://127.0.0.1:3002
          AB_OUT_A: /tmp/cov-main.json
          AB_OUT_B: /tmp/cov-branch.json
          COVERAGE_PACE_MS: '1200'
          AB_WARMUP: '1'
        run: node scripts/coverage-ab.cjs
      - name: Fixed-cohort comparison per chain x metric
        working-directory: branch
        run: node scripts/coverage-compare.cjs /tmp/cov-main.json /tmp/cov-branch.json "main -> branch (same CI environment)"
      - name: Server error tails
        if: always()
        run: tail -n 20 /tmp/main.log /tmp/branch.log /tmp/pubsrv.log || true
