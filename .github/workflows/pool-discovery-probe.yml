name: Pool discovery probe (read-only, on-chain independence)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/pool-discovery-probe.cjs'
      - '.github/workflows/pool-discovery-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node scripts/pool-discovery-probe.cjs | tee /tmp/probe.txt | grep -E "PROBE_SUMMARY|PROBE_ROW"
