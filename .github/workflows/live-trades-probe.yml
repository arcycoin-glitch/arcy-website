name: Live Trading probe (read-only)
on:
  pull_request:
    paths:
      - 'search/server/lib/live-trades.js'
      - 'scripts/probe-live-trades.cjs'
      - '.github/workflows/live-trades-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: main
          path: before
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: BEFORE (main code, same probe and tokens)
        run: LT_ROOT=$GITHUB_WORKSPACE/before LT_TAG=before node scripts/probe-live-trades.cjs
        continue-on-error: true
      - name: AFTER (this branch)
        run: node scripts/probe-live-trades.cjs
