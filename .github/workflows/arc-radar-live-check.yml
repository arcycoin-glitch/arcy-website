name: Arc Radar live check (read-only)
on:
  push:
    branches-ignore: [main]
    paths:
      - 'scripts/probe-arc-radar-live.cjs'
      - '.github/workflows/arc-radar-live-check.yml'
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: node scripts/probe-arc-radar-live.cjs
