name: Market Radar CMC feasibility check
on:
  pull_request:
    paths:
      - 'scripts/probe-cmc-radar.cjs'
      - '.github/workflows/market-radar-cmc-feasibility.yml'
  workflow_dispatch:
jobs:
  cmc-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test public CoinMarketCap network and top-pair endpoints (no API key)
        run: node scripts/probe-cmc-radar.cjs
