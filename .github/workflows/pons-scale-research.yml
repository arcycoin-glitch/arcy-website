name: PONS >100k reconciliation research (read-only, no publication, #337)
# Measures exact reconciliation of 4663:0x39dbed… with a research-only wallet budget. Nothing is signed or published.
on:
  pull_request:
    paths:
      - '.github/workflows/pons-scale-research.yml'
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PONS full ledger + reconciliation with research budget 200000 (no publication dir)
        env:
          ARC_HOLDER_STORAGE: local
          ARC_INDEX_CACHE_DIR: /tmp/holder-index
          HOLDER_CHAIN: '4663'
          CENSUS_BUDGET_MS: '8400000'
          CENSUS_MAX_WALLETS_RESEARCH: '200000'
        run: |
          /usr/bin/time -v node scripts/holder-chain-census.cjs 0x39dbed3a2bd333467115de45665cc57f813c4571 2> /tmp/time.txt || true
          grep -E "Maximum resident|Elapsed" /tmp/time.txt || true
