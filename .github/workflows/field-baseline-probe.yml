name: Field baseline probe (read-only)
on:
  push:
    branches: ['probe/field-baseline-*']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/probe-field-baseline.cjs
