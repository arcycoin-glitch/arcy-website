name: Pulse project research browser checks
on:
  pull_request:
    paths:
      - 'index.html'
      - 'pulse-chain-navigation.*'
      - 'api/pulse.js'
      - 'lib/pulse-project*.js'
      - 'test/pulse-projects*'
      - 'test/helpers/pulse-project-fixtures.cjs'
      - '.github/workflows/pulse-projects-browser.yml'
permissions:
  contents: read
jobs:
  pulse-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node test/pulse-projects-browser.cjs
