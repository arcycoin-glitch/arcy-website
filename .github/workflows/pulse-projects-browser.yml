name: Pulse news browser and real-source checks
on:
  pull_request:
    paths:
      - 'index.html'
      - 'pulse-chain-navigation.*'
      - 'api/pulse.js'
      - 'lib/pulse-project*.js'
      - 'lib/pulse-news*.js'
      - 'lib/pulse-network-http.js'
      - 'lib/pulse-worker-refresh.js'
      - 'scripts/probe-pulse-news.cjs'
      - 'test/pulse-projects*'
      - 'test/pulse-news*.test.js'
      - '.github/workflows/pulse-projects-browser.yml'
permissions:
  contents: read
jobs:
  pulse-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node test/pulse-projects-browser.cjs
  pulse-live-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read-only autonomous source probe
        run: |
          set -o pipefail
          node scripts/probe-pulse-news.cjs | tee pulse-news-sources.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pulse-news-sources
          path: pulse-news-sources.json
