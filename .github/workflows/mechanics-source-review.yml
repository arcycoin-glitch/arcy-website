name: Mechanics source review probe (read-only)
on:
  pull_request:
    paths:
      - 'scripts/probe-mechanics-sources.cjs'
      - 'scripts/mechanics-probe-extra.json'
      - '.github/workflows/mechanics-source-review.yml'
  workflow_dispatch:
concurrency:
  group: mechanics-source-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the standard Mechanics bench sample (read-only)
        run: BENCH_SAMPLES_ONLY=1 node scripts/bench-mechanics.cjs samples
      - name: Source review excerpts (read-only)
        env:
          PROBE_FULL: '45804880,4fabb145,68749665,95ad61,8ed97a,a12cc1,d34a99,b8c774,9f8f72,18e674,6245e6,2e8c31'
        run: node scripts/probe-mechanics-sources.cjs mechanics-samples.json scripts/mechanics-probe-extra.json
