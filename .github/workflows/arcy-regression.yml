name: ARCY Search Regression
on:
  push:
    branches:
      - fix/restore-new-ui-old-data-20261012
      - release/arcy-search-ultimate-20261013
      - qa/search-v3-independent-validation-20261016
      - main
  pull_request:
    branches:
      - main
jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static code and regression tests
        run: |
          node --check search-upgrade.js
          node --check api/search/index.js
          node --check search/server/lib/logo-validation.js
          node --check search/server/lib/report.js
          node --test --test-concurrency=1 test/*.test.js tests/*.test.mjs
