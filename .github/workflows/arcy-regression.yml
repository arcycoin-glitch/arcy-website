name: ARCY Search Regression
on:
  push:
    branches:
      - fix/restore-new-ui-old-data-20261012
      - release/arcy-search-ultimate-20261013
      - main
  pull_request:
    branches:
      - main
jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install real Redis for quota failure simulations
        run: sudo apt-get update -qq && sudo apt-get install -y redis-server redis-tools
      - name: Static code and regression tests
        run: npm test
