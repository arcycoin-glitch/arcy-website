name: Mechanics production verification (read-only, fixed cohort)
on:
  push:
    branches-ignore: [main]
    paths:
      - 'scripts/verify-mechanics-production.cjs'
      - '.github/workflows/mechanics-production-verify.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/verify-mechanics-production.cjs
