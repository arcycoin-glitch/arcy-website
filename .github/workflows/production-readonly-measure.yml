name: Production read-only measurement (manual)
# Reads PUBLIC production endpoints only. Manual or when its own scripts change; never scheduled.
on:
  pull_request:
    paths:
      - 'scripts/probe-radar-missing24h.cjs'
      - 'scripts/probe-radar-change24h.cjs'
      - 'scripts/search-coverage-matrix.cjs'
      - 'scripts/probe-production-release.cjs'
      - '.github/workflows/production-readonly-measure.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-readonly-measure-${{ github.ref }}
  cancel-in-progress: false
jobs:
  radar-missing-24h:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/probe-radar-missing24h.cjs
  coverage-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Per-network, per-card field coverage and evidence classes (10 tokens per network)
        env:
          PER_CHAIN: '10'
          COVERAGE_OUTPUT: coverage.json
        # Measurement only: the production per-IP limiter (24/min) can answer 429 to a fast sequential run; that is reported, not fatal.
        continue-on-error: true
        run: node scripts/search-coverage-matrix.cjs
      - name: Compact summary annotation
        if: always()
        run: |
          node -e "
          const r=require('./coverage.json');
          const agg={};
          for(const s of r.samples){const k=s.section;const a=agg[k]||={slots:0,filled:0,classes:{}};a.slots++;if(s.evidenceClass!=='NOT_VERIFIED')a.filled++;a.classes[s.evidenceClass]=(a.classes[s.evidenceClass]||0)+1;}
          const tokens={};for(const s of r.samples){(tokens[s.section]||=new Set()).add(s.address)}
          for(const k of Object.keys(agg))console.log('::notice title=coverage-'+k+'::'+JSON.stringify({tokens:tokens[k].size,...agg[k]}));
          const cards={};for(const [k,v] of Object.entries(r.totals))cards[k]=v.filled+'/'+v.slots;
          const outcomes={};for(const s of r.samples)outcomes[s.outcome]=(outcomes[s.outcome]||0)+1;
          console.log('::notice title=coverage-cards::'+JSON.stringify(cards).slice(0,3500));
          console.log('::notice title=coverage-outcomes::'+JSON.stringify(outcomes));
          console.log('::notice title=coverage-errors::'+JSON.stringify(r.errors).slice(0,3000));
          console.log('::notice title=coverage-requests::'+JSON.stringify(r.requestStats||null));
          "
      - name: Retain read-only production coverage matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-coverage-matrix
          path: coverage.json
          if-no-files-found: warn
  release-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Production acceptance (render, status, Pulse, Unlocks)
        run: node scripts/probe-production-release.cjs
      - name: Mobile lab performance (Lighthouse, 3 runs, median)
        continue-on-error: true
        run: |
          for i in 1 2 3; do npx -y lighthouse@12 https://www.arcyusdc.xyz/ --quiet --only-categories=performance --form-factor=mobile --screenEmulation.mobile --throttling-method=simulate --chrome-flags="--headless=new --no-sandbox" --output=json --output-path=lh$i.json || true; done
          node -e "
          const fs=require('fs');const runs=[1,2,3].map(i=>{try{return JSON.parse(fs.readFileSync('lh'+i+'.json'))}catch{return null}}).filter(Boolean);
          const m=k=>{const v=runs.map(r=>r.audits[k]?.numericValue).filter(Number.isFinite).sort((a,b)=>a-b);return v.length?Math.round(v[Math.floor(v.length/2)]*1000)/1000:null};
          console.log('::notice title=lighthouse-mobile::'+JSON.stringify({runs:runs.length,score:runs.map(r=>r.categories.performance.score),LCPms:m('largest-contentful-paint'),FCPms:m('first-contentful-paint'),CLS:m('cumulative-layout-shift'),TBTms:m('total-blocking-time'),SIms:m('speed-index'),TTFBms:m('server-response-time'),bytes:m('total-byte-weight')}));"
