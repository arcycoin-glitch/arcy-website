name: Radar continuous research snapshot (V4–V7, read-only sources)
# Issue #279. Computes the ARCY Opportunity Intelligence V4 ranking OUTSIDE visitor requests and publishes a validated JSON
# snapshot to a data-only branch. Vercel deployments are disabled for both data branches in vercel.json.
#  - schedule / manual run on main  -> branch `radar-v4-snapshots` (read by Production/Preview when the V4 flag is ON)
#  - pull_request touching Radar V4 -> branch `radar-v4-snapshots-preview` (safe test ref; Production never reads it)
# Normal fast-forward commits (no force push); a bounded index keeps the last 84 revisions. One run at a time per ref.
on:
  # Publish the first Production data-only snapshot immediately after the reviewed V4 PR is merged;
  # the Production feature flag remains OFF until a separate verified release decision.
  push:
    branches: [main]
    paths:
      - 'lib/radar-v2/**'
      - 'api/search/index.js'
      - 'scripts/radar-v4-snapshot.cjs'
      - 'scripts/radar-snapshot-freshness.cjs'
      - '.github/workflows/radar-v4-snapshot.yml'
  schedule:
    # GitHub drops most scheduled triggers of this repository (a `41 */2` cron delivered ~2 runs/day, with 8-19 h gaps).
    # The cron is therefore frequent; the `freshness` job builds only when the published Production snapshot is >= 100 min old,
    # so the effective cadence stays ~2 h and provider usage does not grow. Off-peak minutes avoid the top-of-hour backlog.
    - cron: '4,19,34,49 * * * *'
  workflow_dispatch:
    inputs:
      target:
        description: 'Data branch to write: preview (safe test, default) or production'
        type: choice
        options: [preview, production]
        default: preview
  pull_request:
    paths:
      - 'lib/radar-v2/**'
      - 'api/search/index.js'
      - 'scripts/radar-v4-snapshot.cjs'
      - 'scripts/radar-snapshot-freshness.cjs'
      - '.github/workflows/radar-v4-snapshot.yml'
permissions:
  contents: write
concurrency:
  group: radar-v4-snapshot-${{ (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.target != 'production')) && 'preview' || 'main' }}
  cancel-in-progress: false
jobs:
  # Decides whether a scheduled run must build (Production snapshot >= 100 min old) and warns explicitly when it is stale.
  freshness:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      build: ${{ steps.age.outputs.build }}
      level: ${{ steps.age.outputs.level }}
      age_min: ${{ steps.age.outputs.age_min }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/radar-snapshot-freshness.cjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: age
        env:
          EVENT_NAME: ${{ github.event_name }}
          SNAPSHOT_URL: https://raw.githubusercontent.com/${{ github.repository }}/radar-v4-snapshots/radar-v4/snapshot.json
        run: node scripts/radar-snapshot-freshness.cjs
  snapshot:
    needs: freshness
    if: needs.freshness.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DATA_REF: ${{ (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.target != 'production')) && 'radar-v4-snapshots-preview' || 'radar-v4-snapshots' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Engine tests must pass before publishing
        run: node --test test/radar-intel.test.js test/radar-v4.test.js test/radar-immutable-snapshot.test.js test/radar-near-match.test.js test/radar-v5-quality.test.js test/radar-v5-final.test.js test/radar-research-order.test.js test/radar-v6-top10.test.js test/radar-v6-owner-top10.test.js test/radar-v8-custom-top10.test.js test/radar-p0-production.test.js test/radar-snapshot-freshness.test.js test/radar-discovery-quality.test.js test/radar-robinhood-pons-quality-p0.test.js test/radar-pre-catalyst.test.js
      - name: Check out data branch (or create it the first time)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          url="https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads "$url" "$DATA_REF" >/dev/null; then
            git clone -q --depth 60 --branch "$DATA_REF" "$url" snap
            echo "FIRST_RUN=0" >> "$GITHUB_ENV"
          else
            mkdir snap && cd snap && git init -q -b "$DATA_REF" && git remote add origin "$url"
            echo "FIRST_RUN=1" >> "$GITHUB_ENV"
          fi
      - name: Read-only copy of the Production data branch (market-memory history seed; never written)
        if: env.DATA_REF != 'radar-v4-snapshots'
        run: git clone -q --depth 60 --branch radar-v4-snapshots "https://github.com/${{ github.repository }}.git" hist || mkdir -p hist
      - name: Build and validate snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # V6 compression: provider OHLCV via an operator-configured CoinGecko Demo key when present; the keyless tier only on
          # non-scheduled runs (manual / pull request / merge), never on the cron schedule.
          COINGECKO_DEMO_API_KEY: ${{ secrets.COINGECKO_DEMO_API_KEY }}
          # V8: site structure and legacy engine remain unchanged; only this snapshot ranking uses the custom top-ten filter.
          RADAR_CUSTOM_FILTER_ENABLED: 'true'
          RADAR_OHLCV_KEYLESS: ${{ github.event_name != 'schedule' && '1' || '' }}
        run: node scripts/radar-v4-snapshot.cjs --previous snap/radar-v4/snapshot.json --out snap/radar-v4/snapshot.json --index snap/radar-v4/index.json --responses snap/radar-v4/served --memory snap/radar-v4/market-memory.json --history hist/radar-v4/snapshot.json --ohlcv-cache snap/radar-v4/ohlcv-cache.json --official-cache snap/radar-v4/official-cache.json
      - name: Verify exact Top 10 and current engine before publishing
        if: env.DATA_REF == 'radar-v4-snapshots'
        run: |
          node -e '
          const fs=require("node:fs"),S=require("./lib/radar-v2/v4-snapshot");
          const s=JSON.parse(fs.readFileSync("snap/radar-v4/snapshot.json","utf8"));
          const g=S.publishable(s,{commit:process.env.GITHUB_SHA});
          console.log(JSON.stringify({engineCommit:s.engineCommit,expected:process.env.GITHUB_SHA,generatedAt:s.generatedAt,...g}));
          if(!g.ok){console.error("Refusing to publish stale, carried-forward or incomplete Radar Top 10 snapshot: "+g.problems.join(", "));process.exit(1);}
          '
      - name: Commit (fast-forward only, never force)
        run: |
          cd snap
          git config user.name "arcy-radar-v4-bot"
          git config user.email "actions@users.noreply.github.com"
          # Vercel reads vercel.json from the deployed commit itself: the data-only branch carries its own
          # "deploymentEnabled": false so a snapshot commit never creates any (Preview or Production) deployment.
          printf '{\n  "git": { "deploymentEnabled": false }\n}\n' > vercel.json
          printf 'Data-only branch for ARCY Radar V4 snapshots (issue #279). Written by .github/workflows/radar-v4-snapshot.yml. Not a deployable site.\n' > README.md
          git add radar-v4 vercel.json README.md
          git diff --cached --quiet && { echo "No change"; exit 0; }
          git commit -q -m "radar-v4 snapshot $(date -u +%Y-%m-%dT%H:%MZ) engine ${GITHUB_SHA::12}"
          git push -q origin "HEAD:${DATA_REF}"
          echo "PUBLISHED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Read back the published snapshot and validate it with the serving code
        if: env.PUBLISHED_SHA != ''
        run: |
          node -e '
          const S=require("./lib/radar-v2/v4-snapshot");
          const sha=process.env.PUBLISHED_SHA,ref=process.env.DATA_REF;
          (async()=>{
           for(let i=0;i<12;i++){
            const r=await fetch("https://raw.githubusercontent.com/${{ github.repository }}/"+sha+"/radar-v4/snapshot.json");
            if(r.ok){const j=await r.json();const v=S.validate(j);
             console.log("::notice title=radar-v4 readback::"+JSON.stringify({ref,sha,firstRun:process.env.FIRST_RUN,http:r.status,valid:v,generatedAt:j.generatedAt,shown:Object.fromEntries(Object.entries(j.sections).map(([n,x])=>[n,x.rows.length]))}));
             if(!v.ok)process.exit(4);return;}
            await new Promise(r=>setTimeout(r,10000));
           }
           console.log("::error title=radar-v4 readback::published snapshot not readable");process.exit(5);
          })();'
  # Explicit alert instead of silently serving older data: one open issue while Production is stale or a Production build failed;
  # closed automatically by the next successful Production publication. Read-only for the site; never changes data.
  alert:
    needs: [freshness, snapshot]
    if: always() && github.event_name != 'pull_request' && !(github.event_name == 'workflow_dispatch' && inputs.target != 'production')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          LEVEL: ${{ needs.freshness.outputs.level }}
          AGE: ${{ needs.freshness.outputs.age_min }}
          BUILD: ${{ needs.snapshot.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Radar Production snapshot needs attention"
          num=$(gh issue list -R "$REPO" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ "$BUILD" = "failure" ] || [ "$BUILD" = "cancelled" ] || { [ "$BUILD" = "skipped" ] && [ "$LEVEL" != "FRESH" ]; }; then
            body="Production snapshot build: ${BUILD}. Published snapshot age before this run: ${AGE:-unknown} min (level ${LEVEL}). Run: ${RUN_URL}. The site keeps serving the last valid snapshot (STALE after 6 h, legacy fallback after 24 h) until a run publishes again."
            echo "::error title=Radar snapshot alert::$body"
            if [ -n "$num" ]; then gh issue comment "$num" -R "$REPO" --body "$body"; else gh issue create -R "$REPO" --title "$title" --body "$body"; fi
          elif [ "$BUILD" = "success" ] && [ -n "$num" ]; then
            gh issue close "$num" -R "$REPO" --comment "Recovered: Production snapshot published by ${RUN_URL}."
          fi

