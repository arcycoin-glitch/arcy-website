name: '#262 production audit (read-only)'
on:
  pull_request:
    paths:
      - 'scripts/probe-262-audit.cjs'
      - '.github/workflows/issue-262-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # The PR #276 Vercel preview is protected (HTTP 401). Audit the INTEGRATED code (exact commit) on a local server
      # instead: real public RPC/providers, no production secrets (worker-backed fields therefore show their unavailable states).
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: 3736ee1bccb91aaecb4a6f4bfede132d3d978555
          path: integrated
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Start integrated engine (local, read-only)
        run: |
          cd integrated && (PORT=3000 node dev.cjs > ../dev.log 2>&1 &)
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:3000/ && break; sleep 1; done
      - run: node scripts/probe-262-audit.cjs
        env:
          ARCY_BASE: http://127.0.0.1:3000
      - if: always()
        run: tail -n 40 dev.log | grep -viE 'key|token|secret' || true
