name: '#262 production audit (read-only)'
on:
  pull_request:
    paths:
      - 'scripts/probe-262-audit.cjs'
      - '.github/workflows/issue-262-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/probe-262-audit.cjs
