name: Premium Search integration Chromium acceptance
on:
  push:
    branches: [feature/search-multichain-premium-20261011]
    paths:
      - 'search/**'
      - 'api/search/**'
      - 'index.html'
      - 'search-upgrade.*'
      - 'dev.cjs'
      - 'vercel.json'
      - 'scripts/search-browser-acceptance.cjs'
      - 'test/search-hardening.test.js'
      - '.github/workflows/search-browser-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Preserve old ARCY site regression suite and verify new research inputs
        run: npm test
      - name: Install isolated browser test dependency
        run: npm install --no-save --ignore-scripts playwright@1.56.0
      - name: Fetch Chromium browser
        run: npx playwright install --with-deps chromium
      - name: Test original live sections untouched and premium token research navigation
        run: node scripts/search-browser-acceptance.cjs
