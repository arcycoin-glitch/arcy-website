name: ARCY Mechanics source review (read-only)
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/review-arc-mechanics-source.cjs'
      - '.github/workflows/arcy-mechanics-source-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Review exact-source POLL and Arc USDT Solidity evidence
        run: node scripts/review-arc-mechanics-source.cjs
