name: Market Radar source compatibility probe
on:
  pull_request:
    paths:
      - 'lib/market-radar.js'
      - 'lib/radar-v2/**'
      - 'scripts/probe-radar-v2.cjs'
      - 'scripts/probe-radar-change24h.cjs'
      - 'scripts/probe-liquidity-definition.cjs'
      - 'scripts/probe-arc-log-range.cjs'
      - 'scripts/search-coverage-matrix.cjs'
      - 'scripts/probe-market-crosscheck.cjs'
      - 'scripts/probe-market-radar.cjs'
      - '.github/workflows/market-radar-source-probe.yml'
  workflow_dispatch:
jobs:
  live-source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate adapter unit tests
        run: node --test test/market-radar.test.js
      - name: Verify source-only live 24H volume endpoints on all three networks
        run: node scripts/probe-market-radar.cjs
      - name: Radar V2 + V3 discovery unit tests
        run: node --test test/radar-v2.test.js test/radar-v3-discovery.test.js
      - name: Pons V2 production-code chain probe (CI only)
        run: node scripts/probe-pons-v2.cjs
        continue-on-error: true
      - name: Pons V2 factory event topics (CI only)
        run: node scripts/probe-pons-v2-events.cjs
        continue-on-error: true
      - name: Liquidity definition evidence (CI only)
        run: node scripts/probe-liquidity-definition.cjs
        continue-on-error: true
      - name: Arc eth_getLogs span evidence (CI only)
        run: node scripts/probe-arc-log-range.cjs
        continue-on-error: true
      - name: Market cross-check + Arc holder-count evidence (CI only)
        run: node scripts/probe-market-crosscheck.cjs
        continue-on-error: true
      - name: Search 3-network coverage matrix (public API, read-only)
        run: node scripts/search-coverage-matrix.cjs
        continue-on-error: true
      - name: Let the public RPC rate window reset
        run: sleep 45
      - name: Pons factory bounded-log probe (CI only)
        run: node scripts/probe-pons-logs.cjs
        continue-on-error: true
      - name: Respect GeckoTerminal keyless 5 calls/minute
        run: sleep 90
      - name: Radar 24h change field coverage probe (read-only, CI only)
        run: node scripts/probe-radar-change24h.cjs
      - name: Upload 24h change evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: change24h-report
          path: change24h-report.json
          if-no-files-found: ignore
      - name: Radar V2 live source probe (paced, keyless, CI only)
        run: node scripts/probe-radar-v2.cjs
        continue-on-error: true
      - name: Publish results A (arc, ethereum)
        if: always()
        run: node scripts/emit-radar-annotations.cjs arc,ethereum
      - name: Publish results B (robinhood, pons)
        if: always()
        run: node scripts/emit-radar-annotations.cjs robinhood,pons
