name: Four-token multichain report cross-check
on:
  push:
    branches: [feature/search-multichain-premium-20261011]
    paths:
      - 'scripts/search-four-contracts-live.cjs'
      - 'search/server/lib/arc-legacy-evidence.js'
      - 'search/server/lib/arc-holder-publication.js'
      - '.github/workflows/search-four-contracts-live.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Compare original Arc USDC ARCY and new Ethereum ONDO Robinhood report identities
        run: node scripts/search-four-contracts-live.cjs
