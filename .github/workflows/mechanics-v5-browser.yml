name: Search browser regression (six-card navigation, Live Trading, Mechanics V5)
on:
  pull_request:
    paths:
      - 'search/server/lib/mechanics-*.js'
      - 'search/server/lib/data-engine.js'
      - 'search/server/lib/research-notes.js'
      - 'test/mechanics-v5-browser.cjs'
      - 'test/six-card-live-trading-browser.cjs'
      - 'test/report-navigation-browser.cjs'
      - 'search/report-navigation.js'
      - 'search/report-navigation.css'
      - 'search/server/lib/live-trades.js'
      # market fields rendered by the Activity/Liquidity cards
      - 'search/server/lib/market-*.js'
      - 'search/server/lib/arc-adapter.js'
      - '.github/workflows/mechanics-v5-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright library (uses the runner image's Google Chrome; no browser download)
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          google-chrome --version
      - name: Mechanics V5 rendering on arc/ethereum/robinhood at 320/390/800/1440 px (mocked fixtures)
        env:
          ARCY_BROWSER_CHANNEL: chrome
        run: |
          node test/mechanics-v5-browser.cjs
          node test/six-card-live-trading-browser.cjs
          node test/report-navigation-browser.cjs
