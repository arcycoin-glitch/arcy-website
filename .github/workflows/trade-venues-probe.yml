name: Live Trading venue review probe (read-only)
on:
  pull_request:
    paths:
      - 'scripts/probe-trade-venues.cjs'
      - '.github/workflows/trade-venues-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/probe-trade-venues.cjs
