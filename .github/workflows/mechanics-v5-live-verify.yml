name: Mechanics V5 live Production verification (read-only)
on:
  pull_request:
    paths:
      - 'scripts/probe-mechanics-v5-live.cjs'
      - '.github/workflows/mechanics-v5-live-verify.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/probe-mechanics-v5-live.cjs
