name: Data Engine V2 production probe (read-only)
on:
  pull_request:
    paths:
      - 'scripts/probe-data-engine-v2.cjs'
      - '.github/workflows/data-engine-v2-prod-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/probe-data-engine-v2.cjs
