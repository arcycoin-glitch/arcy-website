name: Robinhood exact-token historical chart mainnet acceptance
on:
  push:
    branches: [feature/search-multichain-premium-20261011]
    paths:
      - 'scripts/search-robinhood-chart-live.cjs'
      - '.github/workflows/search-robinhood-chart-live.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Validate real Robinhood GeckoTerminal source and OHLCV candles
        run: node scripts/search-robinhood-chart-live.cjs
