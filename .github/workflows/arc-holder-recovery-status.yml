name: Arc Holder recovery status watch (read-only, issue 187)
on:
  push:
    branches-ignore: [main]
    paths:
      - 'scripts/probe-arc-holder-status.cjs'
      - '.github/workflows/arc-holder-recovery-status.yml'
permissions:
  contents: read
concurrency:
  group: arc-holder-recovery-status-${{ github.ref }}
  cancel-in-progress: true
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        plan: ['3:120', '36:540']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: STATUS_ITER=${PLAN%%:*} STATUS_INTERVAL_S=${PLAN##*:} node scripts/probe-arc-holder-status.cjs
        env:
          PLAN: ${{ matrix.plan }}
