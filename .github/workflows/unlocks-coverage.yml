name: Unlocks read-only coverage
on:
  pull_request:
    paths:
      - 'unlock-view.js'
      - 'scripts/probe-unlock-coverage.cjs'
      - '.github/workflows/unlocks-coverage.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Measure current public feed (one GET, no source or infrastructure changes)
        run: node scripts/probe-unlock-coverage.cjs > unlock-coverage.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unlock-coverage
          path: unlock-coverage.json
