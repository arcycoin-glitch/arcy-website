name: Turnover scope probe (read-only production)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/probe-turnover-scope.cjs'
      - '.github/workflows/turnover-scope-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node scripts/probe-turnover-scope.cjs
