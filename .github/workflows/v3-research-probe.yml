name: V3 research probe (read-only)
on:
  pull_request:
    paths:
      - 'scripts/probe-v3-research.cjs'
      - '.github/workflows/v3-research-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/probe-v3-research.cjs
