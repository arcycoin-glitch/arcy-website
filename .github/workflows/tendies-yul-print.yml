name: TENDIES Yul verbatim print (read-only)
on:
  pull_request:
    paths:
      - 'scripts/print-tendies-yul.cjs'
permissions:
  contents: read
jobs:
  print:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/print-tendies-yul.cjs
