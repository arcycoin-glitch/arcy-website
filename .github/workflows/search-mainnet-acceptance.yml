name: Original-site three-chain live Search data acceptance
on:
  push:
    branches: [feature/search-multichain-premium-20261011]
    paths:
      - 'scripts/search-mainnet-acceptance.cjs'
      - '.github/workflows/search-mainnet-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Inspect exact contracts across Arc Ethereum Robinhood
        run: node scripts/search-mainnet-acceptance.cjs
