<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#06121b">
<title>Analytics Opt-out | ARCY SEARCH</title>
<style>
:root{color-scheme:dark;--bg:#06121b;--panel:#0b202c;--line:#274758;--text:#eaf6fa;--muted:#a5bdc7;--cyan:#51dce9;--orange:#f6aa65;--green:#71dac5}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--text);font:15px/1.6 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;padding:24px 16px}
main{width:min(460px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px 22px}
h1{font-size:20px;margin:0 0 6px;letter-spacing:-.01em}
p{margin:6px 0 14px;color:var(--muted);font-size:14px}
.status{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:18px 0;font-weight:700}
.status[data-state="excluded"]{border-color:var(--green);color:var(--green)}
.status[data-state="tracked"]{border-color:var(--orange);color:var(--orange)}
.actions{display:grid;gap:10px}
button{font:inherit;font-weight:700;border-radius:10px;padding:12px 14px;cursor:pointer;border:1px solid var(--line);background:#102d40;color:var(--text)}
button.primary{background:var(--cyan);border-color:var(--cyan);color:#06121b}
button:disabled{opacity:.45;cursor:default}
.note{font-size:12px;margin-top:16px}
</style>
</head>
<body>
<main>
  <h1>Analytics opt-out</h1>
  <p>Controls Vercel Web Analytics for <strong>this browser on this device only</strong>. Other visitors are not affected.</p>
  <div class="status" id="status" role="status" aria-live="polite">Checking…</div>
  <div class="actions">
    <button class="primary" id="exclude" type="button">Exclude This Device</button>
    <button id="include" type="button">Enable Tracking Again</button>
  </div>
  <p class="note">Repeat on every browser and device you use. Clearing site data, or using a private window, resets this choice.</p>
</main>
<script src="/analytics.js"></script>
<script>
(function () {
  'use strict';
  var api = window.arcyAnalyticsOptOut;
  var status = document.getElementById('status');
  var excludeBtn = document.getElementById('exclude');
  var includeBtn = document.getElementById('include');
  function render() {
    if (!api) { status.textContent = 'Unavailable: analytics configuration did not load.'; status.dataset.state = 'tracked'; excludeBtn.disabled = includeBtn.disabled = true; return; }
    var excluded = api.isExcluded();
    status.dataset.state = excluded ? 'excluded' : 'tracked';
    status.textContent = excluded ? 'Excluded — this browser sends no analytics events.' : 'Tracking active — this browser is counted in analytics.';
    excludeBtn.disabled = excluded;
    includeBtn.disabled = !excluded;
  }
  excludeBtn.addEventListener('click', function () { api.exclude(); render(); });
  includeBtn.addEventListener('click', function () { api.include(); render(); });
  render();
})();
</script>
</body>
</html>
